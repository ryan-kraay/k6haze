name: Terraform Deploy on Github
run-name: "Deploy Github ${{github.ref_name}} #${{github.run_attempt}}"

on:
  push: {}
  workflow_dispatch: {}

#on:
#  push:
#    branches:
#      - main
#  workflow_dispatch:

permissions:
  contents: read
  #environments: write
  #secrets: write
  #variables: write

jobs:
  deploy-github:
    runs-on: ubuntu-latest
    environment: RKurator
    steps:
      - name: Checkout Code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install Devbox
        uses: jetify-com/devbox-install-action@a0d2d53632934ae004f878c840055956d9f741b0 # v0.14.0
        with:
          enable-cache: 'true'
          devbox-version: "0.16.0"

      - name: Plan
        run: devbox run tf-github init -input=false && devbox run tf-github plan -input=false

