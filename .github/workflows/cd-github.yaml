name: Terraform Deploy
run-name: "Deploy Github ${{github.ref_name}} #${{github.run_attempt}}"

on:
  push:
    branches: ["main"]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - '**'
#    paths:
#      - terraform/github/**

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  statuses: read
  #contents: read
  #environments: write
  #secrets: write
  #variables: write
 
env:
  # Only apply terraform changes to the main branch
  APPLY_TERRAFORM: ${{ github.ref == 'refs/heads/main' }}

jobs:
  is-latest-checkout:
    name: "Check if current commit is latest"
    # We want to avoid running terraform plan/apply on stale commits
    #   this avoid accidently re-running an old GHA.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Check branch-head equals current checkout
        id: run-version-check
        env:
          BRANCH_NAME: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          ORIGIN_SHA=$(git ls-remote origin "${BRANCH_NAME}" | awk '{print $1}')
          echo "current sha: ${GITHUB_SHA}"
          echo "origin sha: ${ORIGIN_SHA}"

          if [[ "${GITHUB_SHA}" != "${ORIGIN_SHA}" ]]; then
            echo "current sha(${GITHUB_SHA}) is NOT the latest origin sha(${ORIGIN_SHA}) -- pipeline aborted."
            exit 10
          fi

  deploy-github:
    uses: ./.github/workflows/deploy-terraform.yaml
    needs: is-latest-checkout
    with:
      apply_terraform: ${{ env.APPLY_TERRAFORM }}
      environment_name: curator
      terraform_project: "github"
    secrets: inherit # share secrets with the reusable workflow

  deploy-talos:
    uses: ./.github/workflows/deploy-terraform.yaml
    needs: deploy-github
    with:
      apply_terraform: ${{ env.APPLY_TERRAFORM }}
      environment_name: development
      terraform_project: "talos"
    secrets: inherit # share secrets with the reusable workflow
