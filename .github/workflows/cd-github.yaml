name: Terraform Deploy on Github
run-name: "Deploy Github ${{github.ref_name}} #${{github.run_attempt}}"

on:
  push: {}
#    branches: ["main"]
#    paths:
#      - terraform/github/**
  workflow_dispatch:
    inputs: {}

#on:
#  push:
#    branches:
#      - main
#  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  statuses: read
  #contents: read
  #environments: write
  #secrets: write
  #variables: write

jobs:
  deploy-github:
    name: Terraform
    runs-on: ubuntu-latest
    environment: RKurator
    steps:
      - name: Generate Token
        # Used to provide feedback
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        id: app-token
        with:
          app-id: "${{ secrets.BOT_APP_ID3 }}"
          private-key: "${{ secrets.BOT_APP_PRIVATE_KEY3 }}"

      - name: Generate Elevated Token
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        id: elevated-app-token
        with:
          app-id: "${{ secrets.BOT_APP_ID2 }}"
          private-key: "${{ secrets.BOT_APP_PRIVATE_KEY2 }}"

      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          token: "${{ steps.elevated-app-token.outputs.token }}"

      - name: Install Devbox
        uses: jetify-com/devbox-install-action@a0d2d53632934ae004f878c840055956d9f741b0 # v0.14.0
        with:
          enable-cache: 'true'
          devbox-version: "0.16.0"

      - name: Create Wrapper
        uses: ./.github/actions/capture-wrapper
        with:
          command: "devbox"
          wrapper: "devbox-w"

      - name: Syntax Formatting
        id: fmt
        env:
          AWS_ACCESS_KEY_ID: "${{ secrets.AWS_ACCESS_KEY_ID }}"
          AWS_SECRET_ACCESS_KEY: "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          GITHUB_TOKEN: "${{ steps.elevated-app-token.outputs.token }}"
          SOPS_AGE_KEY: "${{ secrets.SOPS_AGE_KEY }}"
          TF_VAR_cloudflare_account_id: "${{ secrets.TF_VAR_cloudflare_account_id }}"
          TF_VAR_terraform_statefile_bucket: "${{ secrets.TF_VAR_terraform_statefile_bucket }}"
          TF_VAR_terraform_statefile_passphrase: "${{ secrets.TF_VAR_terraform_statefile_passphrase }}"
          TF_VAR_github_owner_slug: "${{ github.repository_owner }}"
        run: devbox-w run tf-github fmt -recursive -check .
        continue-on-error: true

      - name: Initialize
        id: init
        env:
          AWS_ACCESS_KEY_ID: "${{ secrets.AWS_ACCESS_KEY_ID }}"
          AWS_SECRET_ACCESS_KEY: "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          GITHUB_TOKEN: "${{ steps.elevated-app-token.outputs.token }}"
          SOPS_AGE_KEY: "${{ secrets.SOPS_AGE_KEY }}"
          TF_VAR_cloudflare_account_id: "${{ secrets.TF_VAR_cloudflare_account_id }}"
          TF_VAR_terraform_statefile_bucket: "${{ secrets.TF_VAR_terraform_statefile_bucket }}"
          TF_VAR_terraform_statefile_passphrase: "${{ secrets.TF_VAR_terraform_statefile_passphrase }}"
          TF_VAR_github_owner_slug: "${{ github.repository_owner }}"
        run: devbox-w run tf-github init -input=false

      - name: Validate
        id: validate
        env:
          AWS_ACCESS_KEY_ID: "${{ secrets.AWS_ACCESS_KEY_ID }}"
          AWS_SECRET_ACCESS_KEY: "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          GITHUB_TOKEN: "${{ steps.elevated-app-token.outputs.token }}"
          SOPS_AGE_KEY: "${{ secrets.SOPS_AGE_KEY }}"
          TF_VAR_cloudflare_account_id: "${{ secrets.TF_VAR_cloudflare_account_id }}"
          TF_VAR_terraform_statefile_bucket: "${{ secrets.TF_VAR_terraform_statefile_bucket }}"
          TF_VAR_terraform_statefile_passphrase: "${{ secrets.TF_VAR_terraform_statefile_passphrase }}"
          TF_VAR_github_owner_slug: "${{ github.repository_owner }}"
        run: devbox-w run tf-github validate

      - name: Plan
        id: plan
        env:
          AWS_ACCESS_KEY_ID: "${{ secrets.AWS_ACCESS_KEY_ID }}"
          AWS_SECRET_ACCESS_KEY: "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          GITHUB_TOKEN: "${{ steps.elevated-app-token.outputs.token }}"
          SOPS_AGE_KEY: "${{ secrets.SOPS_AGE_KEY }}"
          TF_VAR_cloudflare_account_id: "${{ secrets.TF_VAR_cloudflare_account_id }}"
          TF_VAR_terraform_statefile_bucket: "${{ secrets.TF_VAR_terraform_statefile_bucket }}"
          TF_VAR_terraform_statefile_passphrase: "${{ secrets.TF_VAR_terraform_statefile_passphrase }}"
          TF_VAR_github_owner_slug: "${{ github.repository_owner }}"
        run: devbox-w run tf-github plan -input=false
        continue-on-error: true

      - name: Update Pull Request
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          number: 20
          header: test
          message: |
            ```
            hello world
            ```

