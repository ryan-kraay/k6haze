name: Root Specs
run-name: "Root Tests: ${{github.event_name}} on ${{github.ref_name}}#${{github.run_attempt}}"

on:
  workflow_call:

permissions:
  # Needed by junit-report
  checks: write
  # Needed by EncricoMi
  pull-requests: write

jobs:
  run-specs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Devbox
        uses: jetify-com/devbox-install-action@a0d2d53632934ae004f878c840055956d9f741b0 # v0.14.0
        with:
          enable-cache: 'true'
          devbox-version: "0.16.0"

      - name: Run Unit Tests
        run: devbox run test -- --random examples --output junit

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@27d65e188ec43221b20d26de30f4892fad91df2f # v2.22.0
        if: always()
        with:
          check_run: false
          files: |
            report/*.xml
