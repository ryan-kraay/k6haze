name: 🔍 Testing

on:
  workflow_call:
    inputs:
      terraform_project:
        description: "The project name (ie: github, talos, k8s, etc)"
        type: string
        required: true
      environment_name:
        description: "The environment to use"
        type: string
        required: true

jobs:
  tests:
    runs-on: ubuntu-latest
    environment: "${{ inputs.environment_name }}-${{ inputs.terraform_project }}"

    env:
      ##
      ## Secrets are tricky.  We want to expose _specific_ secrets to terraform
      ##   but these secrets vary from project to project.
      ##
      ## We could store all the secrets as terraform.tfvars, but then this makes
      ##   decrypting and using these secrets for local development a bit more
      ##   cumbersome.
      ##
      ## For the moment, we'll just include all the secrets for all our projects
      ##   and wait for this to become an unmaintainble mess
      ##

      ##
      ## Required For All
      ##

      ##
      ## GitHub Project
      ##
      TF_VAR_github_owner_slug: "${{ github.repository_owner }}"

      ##
      ## Talos Project
      ##

      ##
      ## K8s Project
      ##
      KUBECONFIG: "${{ secrets.KUBECONFIG }}"

    steps:
#      - name: Generate Token
#        # Used to provide feedback
#        uses: actions/create-github-app-token@7e473efe3cb98aa54f8d4bac15400b15fad77d94 # v2.2.0
#        id: app-token
#        with:
#          app-id: "${{ secrets.BOT_APP_ID }}"
#          private-key: "${{ secrets.BOT_APP_PRIVATE_KEY }}"

      - name: Checkout
        id: checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        #with:
        #  token: "${{ steps.elevated-app-token.outputs.token }}"

      - name: Install Devbox
        uses: jetify-com/devbox-install-action@a0d2d53632934ae004f878c840055956d9f741b0 # v0.14.0
        with:
          enable-cache: 'true'
          devbox-version: "0.16.0"
          project-path: ".github/"

      - name: Create Wrapper
        uses: ./.github/actions/capture-wrapper
        with:
          command: "devbox"
          wrapper: "devbox-w"

#      - name: Find PR
#        uses: jwalton/gh-find-current-pr@89ee5799558265a1e0e31fab792ebb4ee91c016b # v1
#        id: findPR
#        with:
#          # Can be "open", "closed", or "all".  Defaults to "open".
#          state: open
#
#      - name: "Update PR ${{ steps.findPR.outputs.number }}"
#        id: plan-pr
#        if: success() && steps.findPR.outputs.number
#        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
#        with:
#          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
#          number: ${{ steps.findPR.outputs.number }}
#          header: "${{ inputs.environment_name }}-${{ inputs.terraform_project }}"
#          message: ${{ steps.plan-md.outputs.markdown }}
##          message: |
##            ```
##            hello world
##            ```

      - name: "Spec Test"
        id: spec-test
        run: devbox-w -c ".github/devbox.json" run "${{ inputs.terraform_project }}-spec" --output junit
        continue-on-error: true

      - name: "Publish Spec Results"
        uses: EnricoMi/publish-unit-test-result-action@34d7c956a59aed1bfebf31df77b8de55db9bbaaf # v2.21.0
        if: always()
        with:
          check_run: false
          files: |
            report/*.xml

      - name: "Check Spec Results"
        id: spec-check
        # Terminate the pipeline if the plan had failed
        run: "exit ${{ steps.spec-test.outputs.exit-code }}"
