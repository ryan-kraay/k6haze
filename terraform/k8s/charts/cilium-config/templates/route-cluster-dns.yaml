apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: "route-cluster-dns"
spec:
  description: "Policy for egress allow to kube-dns from all Cilium managed endpoints in the cluster"
  endpointSelector: {}
  egress:
  - toEndpoints:
    - matchLabels:
        io.cilium.k8s.policy.serviceaccount: coredns
        io.kubernetes.pod.namespace: kube-system
    toPorts:
    - ports:
      - port: "53"
        protocol: ANY
      rules:
        # force L7, so we trigger dns extraction, which allows us to use toFQDNs
        # source: https://docs.cilium.io/en/latest/security/policy/language/#obtaining-dns-data-for-use-by-tofqdns
        dns:
          - matchPattern: "*"

