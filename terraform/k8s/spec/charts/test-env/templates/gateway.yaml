apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal-gateway
  namespace: {{ .Release.Namespace }}
spec:
  gatewayClassName: cilium
  listeners:
  - name: http
    port: {{ .Values.gateway.port }}
    protocol: HTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: server-route
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
  - name: internal-gateway
  rules:
  - backendRefs:
    - name: server
      port: {{ .Values.server.port }}
