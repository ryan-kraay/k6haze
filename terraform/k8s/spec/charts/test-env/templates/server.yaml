apiVersion: v1
kind: ServiceAccount
metadata:
  name: server
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-entrypoint-fix
  namespace: {{ .Release.Namespace }}
data:
  entrypoint.sh: |
    #!/bin/sh
    # Fix for nginxinc/nginx-unprivileged:alpine - upstream modified default.conf
    # to only listen on IPv4, breaking IPv6 connectivity in our IPv6-only cluster.
    # The built-in 10-listen-on-ipv6-by-default.sh script fails because the
    # checksum validation detects the modified default.conf and exits early.
    sed -i 's/listen       8080;/listen       8080;\n    listen  [::]:8080;/' /etc/nginx/conf.d/default.conf
    echo "Updated nginx config for IPv6 support"
    exec /docker-entrypoint.sh "$@"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      serviceAccountName: server
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: server
        image: {{ .Values.server.image }}
        command: ["/custom-entrypoint/entrypoint.sh", "nginx", "-g", "daemon off;"]
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: fixed-entrypoint
          mountPath: /custom-entrypoint/
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 1
          timeoutSeconds: 1
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            memory: "32Mi"
            cpu: "25m"
          limits:
            memory: "64Mi"
            cpu: "50m"
      volumes:
      - name: fixed-entrypoint
        configMap:
          name: nginx-entrypoint-fix
          defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: server
  ports:
  - port: {{ .Values.server.port }}
    targetPort: 8080
